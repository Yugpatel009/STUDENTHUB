<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub - Contact</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="../index.html">
            <img src="../img/logo.png" alt="Student Hub Logo">
        </a>
        <nav class="main-nav">
            <a href="../index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <!-- <a href="courses.html">Courses</a> -->
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="page-heading">
            <div>
                <p class="eyebrow">Support</p>
                <h1>Contact Page</h1>
                <p>Send your question to the Student Hub support team.</p>
            </div>
        </section>

        <section class="contact-layout">
            <article class="panel">
                <h2>Contact Us</h2>
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="contact-name">Name</label>
                        <input type="text" id="contact-name" name="name" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="contact-email">Email</label>
                        <input type="email" id="contact-email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="contact-message">Message</label>
                        <textarea id="contact-message" name="message" placeholder="Write your message" required></textarea>
                    </div>

                    <button class="btn btn-primary full" type="submit">Send Message</button>
                </form>
            </article>

            <aside class="support-card">
                <h2>Support Details</h2>
                <p><strong>Email:</strong>D26DCE141@charusat.edu.in</p>
                <p><strong>Phone:</strong> +91 98765 43210</p>
                <a href="https://www.linkedin.com/in/yug-kansagara-2030302a7/" target="_blank" class="btn btn-light full">Connect on LinkedIn</a>
            </aside>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Student Hub. All rights reserved.</p>
    </footer>
    <script src="../js/script.js"></script>
</body>
</html>
